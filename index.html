<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق دكنجي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #F5E9D8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #333; 
        }
        .container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        .logo { 
            width: 120px; 
            height: 120px; 
            border-radius: 25px; 
            object-fit: cover; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            border: 2px solid #F5E9D8;
        }
        h1 { 
            color: #8D4B38; 
            font-size: 24px; 
            margin-bottom: 10px; 
        }
        p { 
            color: #666; 
            font-size: 15px; 
            margin-bottom: 30px; 
            line-height: 1.6; 
        }
        /* ✅ زر التحميل */
        .download-btn { 
            background-color: #8D4B38; 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            text-decoration: none; 
            display: inline-block; 
            transition: transform 0.2s, background-color 0.2s; 
            box-shadow: 0 4px 15px rgba(141, 75, 56, 0.3); 
            cursor: pointer;
        }
        .download-btn:hover { 
            background-color: #6e392b; 
            transform: translateY(-2px); 
        }
        .instructions { 
            margin-top: 25px; 
            font-size: 12px; 
            color: #999; 
            line-height: 1.5;
        }
        /* ✅ تصميم صندوق التنبيه (تم تعديل المسافات ليكون في الأسفل) */
        .vpn-note {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 25px; /* مسافة من الأعلى لبعده عن الملاحظات */
            border: 1px solid #ffeeba;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صورة الأيقونة -->
        <img src="icon.png" alt="شعار دكنجي" class="logo">
        
        <h1>دكنجي - السوق فجيبك</h1>
        
        <p>حمّل التطبيق الآن واستمتع بأفضل تجربة تسوق. توصيل سريع، أسعار منافسة، وكل ما تحتاجه في مكان واحد.</p>
        
        <!-- زر التحميل مع الرابط المباشر -->
        <a href="https://github.com/MOHAMMADALI7AMAD/DukkanGy_v1.0.0/releases/download/v1.0.0/DukkanGy_v.1.0.apk" class="download-btn">تحميل التطبيق</a>
        
        <!-- ملاحظات التثبيت -->
        <div class="instructions">
            قد يطلب منك المتصفح السماح بتثبيت التطبيقات.<br>
            اضغط على "تنزيل" ثم "فتح" لتثبيت التطبيق.
        </div>

        <!-- ✅ صندوق التنبيه للـ VPN في الأسفل تماماً -->
        <div class="vpn-note">
            <span>⚠️</span>
            <span>إذا واجهتك مشكلة في التحميل، يرجى استخدام كاسر الحجب (VPN)</span>
        </div>
    </div>
</body>
</html>
